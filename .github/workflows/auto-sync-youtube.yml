name: Auto-Sync YouTube Content (Shorts, Videos, Live, Playlists)

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Shorts, Videos, Live Streams & Playlists
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID || 'UCuG7-r1F3b2RzGoRFIe0MnQ' }}
        run: npm run sync:youtube

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet src/data/channel.js; then
            echo "Changes detected in YouTube content, committing..."
            git add src/data/channel.js
            git commit -m "chore(auto-sync): update shorts, videos, live stream, and playlists from YouTube"
            git push origin main
          else
            echo "No new YouTube updates detected. Workspace is up-to-date."
          fi
